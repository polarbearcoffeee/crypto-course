<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>進階課程・幣圈新手村</title>
<style>
  :root{
    --bg:#0b1120; --bg-card:#121a2e; --border:#22304a;
    --text:#e6ecf5; --text-dim:#8b98b3; --accent:#22d3ee; --gold:#fbbf24;
  }
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 600px at 80% -10%, #16213f 0%, var(--bg) 60%);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",Segoe UI,sans-serif;
    text-align:center;padding:24px;
  }
  .card{max-width:520px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:40px 32px;}
  .icon{font-size:40px;margin-bottom:12px;}
  h1{font-size:22px;margin:0 0 12px;}
  p{color:var(--text-dim);font-size:15px;line-height:1.8;margin:0 0 24px;}
  a.back{display:inline-block;padding:10px 24px;border-radius:999px;border:1px solid var(--border);color:var(--accent);font-size:14px;}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🚧</div>
    <h1>進階課程製作中，敬請期待</h1>
    <p>恭喜你完成新手課程，代表基礎已經打穩了。進階課程會涵蓋鏈上分析、資產配置邏輯、風險控管與更深入的實戰案例，導師正在整理內容，準備好會第一時間上線。</p>
    <a class="back" href="index.html">← 回到新手課程</a>
  </div>
</body>
</html>
